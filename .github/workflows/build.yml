name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            name: Windows
            args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cible Rust macOS
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Dépendances JavaScript
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          # Dépôt désormais public : le GITHUB_TOKEN par défaut suffit
          # pour publier les installeurs + latest.json dans ce même dépôt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          owner: Frybex
          repo: notinger
          releaseCommitish: main
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Notinger {0}', github.ref_name) || '' }}
          releaseBody: >-
            Installeurs macOS (.dmg, Apple Silicon) et Windows (.exe / .msi).
            L'app macOS est signée ad-hoc (pas de certificat Apple) : au premier lancement, ouvrir Réglages Système → Confidentialité et sécurité → Ouvrir quand même (macOS 15+), ou clic droit → Ouvrir sur macOS 14 et antérieur.
            Si macOS affiche que l'application est « endommagée », exécuter `xattr -cr /Applications/Notinger.app` dans le Terminal, puis rouvrir l'application.
            Windows : Informations complémentaires → Exécuter quand même.
            Les mises à jour suivantes s'installent depuis l'application (latest.json).
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
