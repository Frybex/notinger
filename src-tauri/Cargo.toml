[package]
name = "notinger"
version = "1.0.0"
description = "Schémas et notes visuelles, 100% locaux"
authors = ["Maxence Bastin"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
